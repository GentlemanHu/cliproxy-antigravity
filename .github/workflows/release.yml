name: Release

on:
  push:
    branches:
      - fix/oauth-model-alias-and-claude-bridge
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version without v (e.g. 0.3.3-fix)"
        required: true
        type: string
        default: "0.3.3-fix"

permissions:
  contents: write

env:
  PLUGIN_ID: cliproxy-antigravity
  # GitHub can render workflow_dispatch controls from the default-branch workflow.
  # The fallback keeps feature-branch dispatch safe even when that form has no input.
  RELEASE_VERSION: ${{ inputs.release_version || '0.3.3-fix' }}

concurrency:
  group: agy-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: false
      - name: Validate release version and format
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "::error::Expected X.Y.Z or X.Y.Z-suffix version; got $RELEASE_VERSION"
            exit 1
          fi
          # Make the binary metadata agree with the release without forcing
          # source edits for every release candidate.
          grep -Eq '^[[:space:]]*var[[:space:]]+pluginVersion[[:space:]]*=[[:space:]]*"0\.3\.3"' plugin.go
          gofmt -w *.go scripts/*.go
          go vet ./...
      - name: Unit tests with race detector
        run: CGO_ENABLED=1 go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: so
            cc: aarch64-linux-gnu-gcc
            extra_apt: gcc-aarch64-linux-gnu
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: dylib
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            ext: dll
            cc: x86_64-w64-mingw32-gcc
            extra_apt: gcc-mingw-w64-x86-64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: false
      - name: Install cross-compiler
        if: matrix.extra_apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.extra_apt }}
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          mkdir -p dist
          LIB_NAME="${PLUGIN_ID}.${{ matrix.ext }}"
          ARCHIVE_NAME="${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
          fi
          # Pin the baseline instruction set so the library loads on older CPUs and VMs
          # (CLIProxyAPI's recommendation for distributed c-shared plugins).
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            export GOAMD64=v1 CGO_CFLAGS="-march=x86-64"
          else
            export GOARM64=v8.0 CGO_CFLAGS="-march=armv8-a"
          fi

          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
            -o "dist/${LIB_NAME}" .
          rm -f dist/*.h

          # Validate the native Linux shared library against the CLIProxyAPI ABI.
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            python3 scripts/abi_smoke.py "dist/${LIB_NAME}"
          fi

          go run scripts/package-release.go \
            -library "dist/${LIB_NAME}" \
            -archive "dist/${ARCHIVE_NAME}" \
            -checksum "dist/${ARCHIVE_NAME}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: dist
      - name: Create checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 | sort > checksums.txt
          echo "Generated checksums.txt:"
          cat checksums.txt
          cd ..
          # Do not replace a published release from an earlier workflow.
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::Release v${RELEASE_VERSION} already exists; bump the version."
            exit 1
          fi
          # Publish only after all tests/builds succeed.
          gh release create "v${RELEASE_VERSION}" \
            dist/*.zip \
            dist/checksums.txt \
            --target "${GITHUB_SHA}" \
            --title "v${RELEASE_VERSION} (GentlemanHu Fork)" \
            --generate-notes
